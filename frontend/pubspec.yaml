name: wilddeck
description: WildDeck — Play Wild. Win Fast.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebSocket communication
  web_socket_channel: ^2.4.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0

  # State management
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # Networking
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Code generation annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: GameFont
      fonts:
        - asset: assets/fonts/GameFont-Regular.ttf
        - asset: assets/fonts/GameFont-Bold.ttf
          weight: 700
