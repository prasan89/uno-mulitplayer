name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Cloud Run (Staging)
    runs-on: ubuntu-latest
    needs: []
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/uno-multiplayer/backend:${{ github.sha }}
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/uno-multiplayer/backend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture current Cloud Run revision (for rollback)
        id: current-revision
        run: |
          CURRENT=$(gcloud run services describe uno-multiplayer-staging \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format 'value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "revision=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: uno-multiplayer-staging
          region: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/uno-multiplayer/backend:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1

      - name: Health check staging deployment
        id: health-check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Checking health at ${SERVICE_URL}/health"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${SERVICE_URL}/health")
          echo "HTTP status: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "Health check failed with status ${STATUS}"
            exit 1
          fi
          echo "Health check passed"

      - name: Rollback to previous revision on failure
        if: failure() && steps.current-revision.outputs.revision != ''
        run: |
          echo "Rolling back to revision: ${{ steps.current-revision.outputs.revision }}"
          gcloud run services update-traffic uno-multiplayer-staging \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --to-revisions=${{ steps.current-revision.outputs.revision }}=100
          echo "Rollback complete"

      - name: Deployment summary
        if: success()
        run: |
          echo "Staging deployment succeeded"
          echo "Image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/uno-multiplayer/backend:${{ github.sha }}"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
