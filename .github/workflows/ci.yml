name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wilddeck_test
          POSTGRES_USER: wilddeck_user
          POSTGRES_PASSWORD: wilddeck_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.22-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.22-

      - name: Download Go dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run Go tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://wilddeck_user:wilddeck_password@localhost:5432/wilddeck_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_for_ci
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend/coverage.out
          retention-days: 7

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./backend

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: ./frontend
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter tests
        working-directory: ./frontend
        run: flutter test --coverage

      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: ./frontend/coverage/lcov.info
          retention-days: 7

  flutter-build-android:
    name: Flutter Build Android
    runs-on: ubuntu-latest
    needs: flutter-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Android APK (release)
        working-directory: ./frontend
        run: flutter build apk --release

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wilddeck/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
