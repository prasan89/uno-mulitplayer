version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wilddeck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wilddeck
      POSTGRES_USER: wilddeck
      POSTGRES_PASSWORD: wilddeck_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilddeck -d wilddeck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wilddeck_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./backend
    container_name: wilddeck_server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
